# MIA platform configuration. Mounted at /app/librechat.yaml by docker-compose.override.yml.
version: 1.3.17

cache: true

# Keep the interface to chat history, new chat, the Claude/agents selector, web search and MCP.
interface:
  modelSelect: true
  parameters: false
  presets: false
  multiConvo: false
  bookmarks: false
  memories: false
  prompts: false
  temporaryChat: false
  runCode: false
  fileSearch: false
  fileCitations: true
  webSearch: true
  feedback: false
  contextCost: false
  buildInfo: false
  sharedLinks: false
  schedules: false
  skills: false
  # The agent marketplace groups agents by category, e.g. Cuidado animal for the feline and canine caretakers.
  marketplace:
    use: true
  remoteAgents:
    use: false
  # Sharing agents is left to Admin Settings (per role) instead of this file: when share/public are set
  # here they overwrite every role on each start, including ADMIN, so the admin could never publish an agent.
  agents:
    use: true
    create: true
  mcpServers:
    use: true
    create: false
    share: false
    public: false

endpoints:
  agents:
    allowedProviders:
      - anthropic
    capabilities: ['tools', 'web_search', 'file_search', 'artifacts']

webSearch:
  searchProvider: tavily
  scraperProvider: tavily
  tavilyApiKey: '${TAVILY_API_KEY}'
  tavilySearchOptions:
    searchDepth: basic
    maxResults: 5
    topic: general

# Natural voice through OpenAI: Whisper listens in Spanish and gpt-4o-mini-tts answers. Every user starts in
# conversation mode (speak, auto-send after 3 s of silence, hear the answer); each can change it in Settings.
speech:
  stt:
    openai:
      apiKey: '${SPEECH_OPENAI_API_KEY}'
      model: 'whisper-1'
  tts:
    openai:
      apiKey: '${SPEECH_OPENAI_API_KEY}'
      model: 'gpt-4o-mini-tts'
      voices: ['nova', 'coral', 'shimmer', 'sage', 'alloy', 'ash', 'echo', 'onyx']
  speechTab:
    conversationMode: true
    advancedMode: false
    speechToText:
      engineSTT: 'openai'
      languageSTT: 'es-CO'
      autoTranscribeAudio: true
      autoSendText: 3
    textToSpeech:
      engineTTS: 'openai'
      voice: 'nova'
      languageTTS: 'es'
      automaticPlayback: true
      playbackRate: 1

mcpSettings:
  # The backtest MCP runs on the private Docker/Railway network; exempt exactly that host and port.
  allowedAddresses:
    - 'backtest-mcp:8001'
    - 'catlife-mcp:8001'
    - 'habits-mcp:8001'

mcpServers:
  auditor-backtests:
    type: streamable-http
    url: http://backtest-mcp:8001/mcp/
    title: 'Auditor de Backtests'
    description: 'Lee informes ya calculados por el motor determinista y pide nuevas corridas. No calcula métricas.'
    timeout: 120000
    serverInstructions: true

  cat-life:
    type: streamable-http
    url: http://catlife-mcp:8001/mcp/
    title: 'Cuidador Felino'
    description: 'Gatos: vacunas, purgantes, historial clínico, recordatorios y carné; se comparten con la familia en MIA.'
    timeout: 60000
    serverInstructions: true
    headers:
      X-MIA-User-Id: '{{LIBRECHAT_USER_ID}}'
      X-MIA-User-Name: '{{LIBRECHAT_USER_NAME}}'
      X-MIA-User-Email: '{{LIBRECHAT_USER_EMAIL}}'
      X-MIA-Species: 'gato'

  dog-life:
    type: streamable-http
    url: http://catlife-mcp:8001/mcp/
    title: 'Cuidador Canino'
    description: 'Perros: vacunas, purgantes, historial clínico, recordatorios y carné; se comparten con la familia en MIA.'
    timeout: 60000
    serverInstructions: true
    headers:
      X-MIA-User-Id: '{{LIBRECHAT_USER_ID}}'
      X-MIA-User-Name: '{{LIBRECHAT_USER_NAME}}'
      X-MIA-User-Email: '{{LIBRECHAT_USER_EMAIL}}'
      X-MIA-Species: 'perro'

  habitos:
    type: streamable-http
    url: http://habits-mcp:8001/mcp/
    title: 'Hábitos'
    description: 'Cuenta cuántas veces comes algo, visitas a alguien, fumas o haces cualquier cosa, y lo grafica en el año.'
    timeout: 60000
    serverInstructions: true
    headers:
      X-MIA-User-Id: '{{LIBRECHAT_USER_ID}}'
