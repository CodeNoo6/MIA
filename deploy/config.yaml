# MIA platform configuration. Mounted at /app/librechat.yaml by docker-compose.override.yml.
version: 1.3.17

cache: true

# Keep the interface to chat history, new chat, the Claude/agents selector, web search and MCP.
interface:
  modelSelect: true
  parameters: false
  presets: false
  multiConvo: false
  bookmarks: false
  memories: false
  prompts: false
  temporaryChat: false
  runCode: false
  fileSearch: false
  fileCitations: true
  webSearch: true
  feedback: false
  contextCost: false
  buildInfo: false
  sharedLinks: false
  schedules: false
  skills: false
  marketplace:
    use: false
  remoteAgents:
    use: false
  agents:
    use: true
    create: true
    share: false
    public: false
  mcpServers:
    use: true
    create: false
    share: false
    public: false

endpoints:
  agents:
    allowedProviders:
      - anthropic
    capabilities: ['tools', 'web_search', 'file_search', 'artifacts']

webSearch:
  searchProvider: tavily
  scraperProvider: tavily
  tavilyApiKey: '${TAVILY_API_KEY}'
  tavilySearchOptions:
    searchDepth: basic
    maxResults: 5
    topic: general

mcpSettings:
  # The backtest MCP runs on the private Docker/Railway network; exempt exactly that host and port.
  allowedAddresses:
    - 'backtest-mcp:8001'
    - 'catlife-mcp:8001'

mcpServers:
  auditor-backtests:
    type: streamable-http
    url: http://backtest-mcp:8001/mcp/
    title: 'Auditor de Backtests'
    description: 'Lee informes ya calculados por el motor determinista y pide nuevas corridas. No calcula métricas.'
    timeout: 120000
    serverInstructions: true

  cat-life:
    type: streamable-http
    url: http://catlife-mcp:8001/mcp/
    title: 'Cat Life'
    description: 'Gatos, vacunas, historial clínico, recordatorios y carné; se comparten con la familia en MIA.'
    timeout: 60000
    serverInstructions: true
    headers:
      X-MIA-User-Id: '{{LIBRECHAT_USER_ID}}'
      X-MIA-User-Name: '{{LIBRECHAT_USER_NAME}}'
      X-MIA-User-Email: '{{LIBRECHAT_USER_EMAIL}}'
