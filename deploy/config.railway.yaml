# MIA platform configuration for Railway. Point CONFIG_PATH=/app/deploy/config.railway.yaml at it.
version: 1.3.17

cache: true

# Keep the interface to chat history, new chat, the Claude/agents selector, web search and MCP.
interface:
  modelSelect: true
  parameters: false
  presets: false
  multiConvo: false
  bookmarks: false
  memories: false
  prompts: false
  temporaryChat: false
  runCode: false
  fileSearch: false
  fileCitations: true
  webSearch: true
  feedback: false
  contextCost: false
  buildInfo: false
  sharedLinks: false
  schedules: false
  skills: false
  # The agent marketplace groups agents by category, e.g. Cuidado animal for the feline and canine caretakers.
  marketplace:
    use: true
  remoteAgents:
    use: false
  agents:
    use: true
    create: true
    share: false
    public: false
  mcpServers:
    use: true
    create: false
    share: false
    public: false

endpoints:
  agents:
    allowedProviders:
      - anthropic
    capabilities: ['tools', 'web_search', 'file_search', 'artifacts']

webSearch:
  searchProvider: tavily
  scraperProvider: tavily
  tavilyApiKey: '${TAVILY_API_KEY}'
  tavilySearchOptions:
    searchDepth: basic
    maxResults: 5
    topic: general

mcpSettings:
  # The backtest and Cat Life MCPs run on Railway's private network; exempt exactly those hosts and ports.
  allowedAddresses:
    - 'backtest-mcp.railway.internal:8001'
    - 'catlife-mcp.railway.internal:8001'

mcpServers:
  auditor-backtests:
    type: streamable-http
    url: http://backtest-mcp.railway.internal:8001/mcp/
    title: 'Auditor de Backtests'
    description: 'Lee informes ya calculados por el motor determinista y pide nuevas corridas. No calcula métricas.'
    timeout: 120000
    serverInstructions: true

  cat-life:
    type: streamable-http
    url: http://catlife-mcp.railway.internal:8001/mcp/
    title: 'Cuidador Felino'
    description: 'Gatos: vacunas, purgantes, historial clínico, recordatorios y carné; se comparten con la familia en MIA.'
    timeout: 60000
    serverInstructions: true
    headers:
      X-MIA-User-Id: '{{LIBRECHAT_USER_ID}}'
      X-MIA-User-Name: '{{LIBRECHAT_USER_NAME}}'
      X-MIA-User-Email: '{{LIBRECHAT_USER_EMAIL}}'
      X-MIA-Species: 'gato'
      X-CatLife-Token: '${CATLIFE_MCP_TOKEN}'

  dog-life:
    type: streamable-http
    url: http://catlife-mcp.railway.internal:8001/mcp/
    title: 'Cuidador Canino'
    description: 'Perros: vacunas, purgantes, historial clínico, recordatorios y carné; se comparten con la familia en MIA.'
    timeout: 60000
    serverInstructions: true
    headers:
      X-MIA-User-Id: '{{LIBRECHAT_USER_ID}}'
      X-MIA-User-Name: '{{LIBRECHAT_USER_NAME}}'
      X-MIA-User-Email: '{{LIBRECHAT_USER_EMAIL}}'
      X-MIA-Species: 'perro'
      X-CatLife-Token: '${CATLIFE_MCP_TOKEN}'
